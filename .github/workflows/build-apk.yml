name: Build APK

# 触发方式：
#   1. push 到 main            -> 产出 Debug APK（4 个 ABI）
#   2. push tag v*             -> 产出 Debug APK + Release APK，并自动创建 GitHub Release
#   3. Actions 页面手动运行     -> 可勾选「同时构建 Release」
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "同时构建 Release（配置了签名密钥会自动签名）"
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # 构建 Release 需要：Settings -> Secrets and variables -> Actions
      #   Secret: API_AUTH_KEY        （必填，否则只能用占位符编译）
      #   Secret: KEYSTORE_BASE64     （可选，签名用；没有则不产出 Release 包）
      #   Secret: KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      #   Variable: API_APP_ID        （可选，默认 cloud_music）
      API_AUTH_KEY: ${{ secrets.API_AUTH_KEY || vars.API_AUTH_KEY }}
      API_APP_ID: ${{ vars.API_APP_ID }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Resolve API key
        id: apikey
        run: |
          if [ -z "${API_AUTH_KEY}" ]; then
            echo "::warning::未配置 API_AUTH_KEY（Actions Secret 或 Variable），本次使用占位符编译。请在仓库 Settings → Secrets and variables → Actions 中添加 API_AUTH_KEY 后重新运行，APK 才能正常鉴权。"
            echo "key=PLACEHOLDER_API_KEY_SET_IN_ACTIONS" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::已使用配置的 API_AUTH_KEY 编译。"
            echo "key=${API_AUTH_KEY}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        env:
          API_AUTH_KEY: ${{ steps.apikey.outputs.key }}
        run: |
          ./gradlew assembleDebug \
            -PAPI_AUTH_KEY="${API_AUTH_KEY}" \
            -Pandroid.suppressUnsupportedCompileSdk=36 \
            --stacktrace

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        continue-on-error: true
        env:
          API_AUTH_KEY: ${{ steps.apikey.outputs.key }}
        run: |
          ./gradlew assembleRelease \
            -PAPI_AUTH_KEY="${API_AUTH_KEY}" \
            -Pandroid.suppressUnsupportedCompileSdk=36 \
            --stacktrace

      - name: Sign Release APK (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          mkdir -p signed
          shopt -s nullglob
          for f in app/build/outputs/apk/release/*-unsigned.apk; do
            base="$(basename "$f" -unsigned.apk)"
            "$BT/zipalign" -p -f 4 "$f" "signed/$base.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              "signed/$base.apk"
          done
          ls -la signed

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          # Debug 包（debug 签名，可直接安装）
          for f in app/build/outputs/apk/debug/*.apk; do cp "$f" dist/; done
          # 已签名的 Release 包（未签名的 release-unsigned 不放进产物，因为装不上）
          for f in signed/*.apk; do cp "$f" dist/; done
          ls -la dist
          ( cd dist && sha256sum *.apk | tee SHA256SUMS.txt )

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YinDong-Music-APK-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Build summary
        if: always()
        run: |
          {
            echo "### 构建结果"
            echo ""
            echo "- 触发：\`${{ github.ref }}\`"
            if [ -d dist ]; then
              echo "- 产物："
              ls -la dist || true
              echo ""
              echo '```'
              cat dist/SHA256SUMS.txt 2>/dev/null || true
              echo '```'
            else
              echo "- 没有产出 APK，请查看上面的构建日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
